name: tapes

on:
  push:
    branches: [main]
    paths:
      - "tapes/**"
      - "tmux/**"
      - "flake.nix"
      - "flake.lock"
      - "site/**"
      - "scripts/build-site.sh"
      - ".github/workflows/tapes.yml"
  pull_request:
    paths:
      - "tapes/**"
      - "tmux/**"
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: tapes-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true

      - name: record tapes
        # vhs launches a headless chromium (via ttyd/rod); running it inside
        # a `nix build` derivation's sandbox breaks that even with
        # __noChroot set, so tapes are recorded via `nix run` instead --
        # nix only provisions the toolchain, and vhs executes directly in
        # this job's own shell, one tape at a time (also sidesteps two
        # tapes racing to create the same tmux session name).
        run: |
          set -o pipefail
          mkdir -p out
          for tape in tapes/*.tape; do
            echo "::group::$tape"
            nix run .#record-tape -- "$tape"
            echo "::endgroup::"
          done

      - name: upload rendered videos (artifact, every run)
        uses: actions/upload-artifact@v4
        with:
          name: tapes
          path: out/
          if-no-files-found: error

      - name: build site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: nix run .#build-site -- out _site

      - name: upload pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
