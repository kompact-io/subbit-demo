name: tapes

on:
  push:
    branches: [main]
    paths:
      - "tapes/**"
      - "tmux/**"
      - "flake.nix"
      - "flake.lock"
      - "site/**"
      - "scripts/build-site.sh"
      - ".github/workflows/tapes.yml"
  pull_request:
    paths:
      - "tapes/**"
      - "tmux/**"
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: tapes-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # vhs launches a headless chromium (via ttyd/rod) which can't set
          # up its own sandbox inside nix's build sandbox, so tape
          # derivations opt out via __noChroot
          extra-conf: |
            sandbox = relaxed
            accept-flake-config = true

      - name: build all tapes
        run: nix build .#all-tapes -L --print-build-logs --max-jobs 1

      - name: upload rendered videos (artifact, every run)
        uses: actions/upload-artifact@v4
        with:
          name: tapes
          path: result/
          if-no-files-found: error

      - name: build site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: nix run .#build-site -- result _site

      - name: upload pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
